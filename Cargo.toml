[workspace]
resolver = "3"
members = [
    "crates/telemetry",
    "crates/reference",
    "crates/analysis",
    "crates/triggers",
    "crates/voice",
    "crates/mcp",
    "crates/coach",
    "crates/input",
    "crates/ui",
    "crates/app",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
memmap2 = "0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
telemetry = { path = "crates/telemetry" }
reference = { path = "crates/reference" }
analysis = { path = "crates/analysis" }
csv = "1.3"
triggers = { path = "crates/triggers" }
voice = { path = "crates/voice", default-features = false }
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
cpal = "0.18"
# System certificates (platform-verifier): works behind a corporate proxy
# that inspects TLS.
ureq = { version = "3.5", features = ["json", "platform-verifier"] }
serde_json = "1.0"
schemars = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures = "0.3"
getrandom = "0.4"
rmcp = { version = "3.10", features = ["server", "macros", "transport-streamable-http-server"] }
agent-client-protocol = { version = "5.3", features = ["process"] }
mcp = { path = "crates/mcp" }
coach = { path = "crates/coach" }
input = { path = "crates/input" }
device_query = "4.0"
gilrs = "0.11"
directories = "6.0"
# Pinned to 1.x: 2.x no longer bundles espeak-ng for Piper (see docs/verifications.md).
sherpa-onnx = { version = "=1.13.8", default-features = false }
ui = { path = "crates/ui" }
# GPUI: the `gpui` crate on crates.io is frozen at 0.2.2 (Oct. 2025). `gpui-pre` is
# a weekly snapshot of Zed (lib `gpui`), also used by gpui-component.
# Versions pinned exactly: the API changes from one week to the next.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
