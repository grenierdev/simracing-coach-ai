[workspace]
resolver = "3"
members = [
    "crates/telemetry",
    "crates/reference",
    "crates/analysis",
    "crates/triggers",
    "crates/voice",
    "crates/mcp",
    "crates/coach",
    "crates/ui",
    "crates/app",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
memmap2 = "0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
telemetry = { path = "crates/telemetry" }
reference = { path = "crates/reference" }
analysis = { path = "crates/analysis" }
csv = "1.3"
triggers = { path = "crates/triggers" }
voice = { path = "crates/voice", default-features = false }
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
cpal = "0.18"
# Certificats du système (platform-verifier) : fonctionne derrière un proxy
# d'entreprise qui inspecte le TLS.
ureq = { version = "3.5", features = ["json", "platform-verifier"] }
serde_json = "1.0"
schemars = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures = "0.3"
getrandom = "0.4"
rmcp = { version = "3.10", features = ["server", "macros", "transport-streamable-http-server"] }
agent-client-protocol = { version = "5.3", features = ["process"] }
mcp = { path = "crates/mcp" }
coach = { path = "crates/coach" }
directories = "6.0"
# Épinglé en 1.x : la 2.x n'embarque plus espeak-ng pour Piper (voir docs/verifications.md).
sherpa-onnx = { version = "=1.13.8", default-features = false }
ui = { path = "crates/ui" }
# GPUI : la crate `gpui` de crates.io est figée en 0.2.2 (oct. 2025). `gpui-pre` est
# un instantané hebdomadaire de Zed (lib `gpui`), utilisé aussi par gpui-component.
# Versions épinglées exactement : l'API change d'une semaine à l'autre.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
