[package]
name = "app"
description = "Voice simracing coach for iRacing"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["sherpa-static"]
# sherpa-onnx voice. `sherpa-shared` + SHERPA_ONNX_LIB_DIR: local library
# (machines without access to GitHub releases).
voice-sherpa = []
sherpa-static = ["voice-sherpa", "voice/sherpa-static"]
sherpa-shared = ["voice-sherpa", "voice/sherpa-shared"]

[[bin]]
name = "simcoach"
path = "src/main.rs"

[dependencies]
telemetry.workspace = true
reference.workspace = true
ui.workspace = true
triggers.workspace = true
voice.workspace = true
analysis.workspace = true
mcp.workspace = true
coach.workspace = true
input.workspace = true
tokio.workspace = true
directories.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
