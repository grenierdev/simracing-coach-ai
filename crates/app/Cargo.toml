[package]
name = "app"
description = "Coach vocal de simracing pour iRacing"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["sherpa-static"]
# Voix sherpa-onnx. `sherpa-shared` + SHERPA_ONNX_LIB_DIR : bibliothèque locale
# (machines sans accès aux releases GitHub).
voice-sherpa = []
sherpa-static = ["voice-sherpa", "voice/sherpa-static"]
sherpa-shared = ["voice-sherpa", "voice/sherpa-shared"]

[[bin]]
name = "simcoach"
path = "src/main.rs"

[dependencies]
telemetry.workspace = true
reference.workspace = true
ui.workspace = true
triggers.workspace = true
voice.workspace = true
analysis.workspace = true
mcp.workspace = true
coach.workspace = true
tokio.workspace = true
directories.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
