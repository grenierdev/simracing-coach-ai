[package]
name = "voice"
description = "Coach voice: swappable Tts/Stt traits, sherpa-onnx, audio output"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["sherpa-static"]
# sherpa-onnx engines (Piper, Kokoro, Parakeet). `static` downloads the
# prebuilt library from the GitHub releases; `shared` uses a local shared
# library pointed to by SHERPA_ONNX_LIB_DIR.
sherpa = ["dep:sherpa-onnx"]
sherpa-static = ["sherpa", "sherpa-onnx/static"]
sherpa-shared = ["sherpa", "sherpa-onnx/shared"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
cpal.workspace = true
ureq.workspace = true
serde.workspace = true
directories.workspace = true
sherpa-onnx = { workspace = true, optional = true }
