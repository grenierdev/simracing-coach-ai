name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (GPUI, ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libfreetype-dev libfontconfig-dev libwayland-dev libvulkan1 \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys réutilise l'archive de target/sherpa-onnx-prebuilt ; une
      # copie partielle restaurée par le cache s'extrait sans la bibliothèque.
      - name: Rafraîchir sherpa-onnx (archive précompilée)
        shell: bash
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean -p sherpa-onnx-sys
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys réutilise l'archive de target/sherpa-onnx-prebuilt ; une
      # copie partielle restaurée par le cache s'extrait sans la bibliothèque.
      - name: Rafraîchir sherpa-onnx (archive précompilée)
        shell: bash
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean -p sherpa-onnx-sys
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
