# Demo plan for the synthetic track (simcoach --synthetic).
#
# Positions: per corner (anchor + offset in metres) or absolute (LapDistPct).
# The coach stays quiet from 30 m before each reference braking point until the
# apex, and never starts a sentence that would not have time to be said before.
# At 250 km/h, a 2.5 s sentence covers about 175 m: cues are placed 250 to
# 300 m before the braking point.

[settings]
quiet_lead_m = 30
quiet_until = "apex"
max_delay_m = 150

[[trigger]]
id = "lap"
position = 0.005
text = "New lap, let's push."
repeat = "once"
priority = 3

[[trigger]]
id = "t1"
corner = "T1"
offset_m = -300
text = "Turn one, brake progressively."
priority = 6

[[trigger]]
id = "t4"
corner = "T4"
offset_m = -300
text = "Hairpin, be patient on the throttle."
priority = 7

[[trigger]]
id = "t5-delta"
corner = "T5"
anchor = "entry"
offset_m = -150
text = "You're behind, carry more speed through the fast corner."
condition = { delta_above = 0.3 }
priority = 5

[[trigger]]
id = "t6"
corner = "T6"
offset_m = -300
text = "Last corner, wide exit."
repeat = { laps = 3 }
priority = 6
